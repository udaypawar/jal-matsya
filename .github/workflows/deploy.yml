# CI/CD for the Jal Matsya website.
#
# - Pull requests: lint, typecheck and a static build (no deploy).
# - Pushes to main (or a manual run): same checks, then deploy apps/web/out to GitHub Pages.
#
# One-time setup in the repo: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: CI / Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pages deploys need these; checkout only needs read.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; don't cancel a deploy that's already running.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Yarn 4 is committed in .yarn/releases (yarnPath), so the runner's yarn delegates to it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      # Gives the site's base path: "/jal-matsya" for udaypawar.github.io/jal-matsya,
      # or "" once a custom domain is set. Skipped on PRs (no Pages permissions needed).
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build static site
        run: yarn build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
