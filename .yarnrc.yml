nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.18.1.cjs

# Supply-chain protection: Yarn's secure defaults are intentionally NOT overridden here.
#   enableScripts            false  — dependencies can't run install scripts. If one ever needs to,
#                                     allow just that package in package.json:
#                                     "dependenciesMeta": { "<pkg>": { "built": true } }
#   npmMinimalAgeGate        1 day  — brand-new releases (a common hijack window) aren't installed
#   approvedGitRepositories  none   — no dependencies straight from git
